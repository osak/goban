name: Deploy to GitHub Pages

# デフォルトブランチへの push のたびに dist/ をビルドして GitHub Pages に公開する。
# 事前にリポジトリの Settings → Pages → Build and deployment → Source を
# 「GitHub Actions」にしておくこと。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# 公開は 1 つずつ行い、実行中の公開は途中で止めない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # デフォルトブランチだけを公開する（ブランチ名に依存しないよう event から判定する）
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # 型チェックのあと dist/ に出力する（相対パスなので https://<user>.github.io/<repo>/ でそのまま動く）
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
